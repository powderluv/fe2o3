[package]
name = "fe2o3-gfx950-low-precision"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/harsh-nod/fe2o3"
rust-version = "1.94"
publish = false

[features]
kernel-fp4-gemm = []
kernel-fp8-gemm = []
kernel-simt-fp8-gemm = []
kernel-simt-fp4-gemm = []
kernel-mixed-fp4-fp8-gemm = []
kernel-fp4-attention = []
kernel-fp8-attention = []
kernel-simt-fp8-attention = []
kernel-simt-fp4-attention = []

[workspace]
members = []
resolver = "3"

[dependencies]
fe2o3-device = { path = "../../crates/fe2o3-device" }

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host = { path = "../../crates/fe2o3-host" }

[lib]
name = "fe2o3_gfx950_low_precision"
path = "src/lib.rs"

# Keep standalone host-test images within the pinned runner hashing bound.
[profile.test]
debug = 0
