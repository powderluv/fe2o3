[package]
name = "fe2o3-workgroup-sync-v1"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/harsh-nod/fe2o3"
rust-version = "1.94"
publish = false

# Keep this profile package independently testable until compiler profile
# registration and protected runtime execution are implemented.
[workspace]

# This standalone workspace does not inherit the root test profile.
# Keep dependency archives within the ordinary CLI file bound.
[profile.test]
debug = 0

[features]
default = ["lds-kernel", "scoped-atomic-kernel"]
lds-kernel = []
lds-u32-kernel = []
row-affine-u32-kernel = []
row-affine-u32-tile-kernel = []
lds-f32-kernel = []
lds-scan-u32-kernel = []
lds-scan-u32-65-kernel = []
lds-scan-u32-255-kernel = []
lds-scan-u32-exclusive-kernel = []
lds-scan-u32-exclusive-3-kernel = []
lds-scan-u32-exclusive-65-kernel = []
lds-scan-i32-kernel = []
lds-scan-i32-3-kernel = []
lds-scan-i32-255-kernel = []
lds-scan-i32-inclusive-kernel = []
lds-scan-i32-inclusive-65-kernel = []
lds-scan-i32-inclusive-255-kernel = []
lds-scan-f32-kernel = []
lds-scan-f32-3-kernel = []
lds-scan-f32-65-kernel = []
lds-scan-f32-exclusive-kernel = []
lds-scan-f32-exclusive-3-kernel = []
lds-scan-f32-exclusive-255-kernel = []
scoped-atomic-kernel = []

[dependencies]
fe2o3-device = { path = "../../crates/fe2o3-device" }

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host = { path = "../../crates/fe2o3-host" }

[dev-dependencies]
fe2o3-hsaco = { path = "../../crates/fe2o3-hsaco" }
syn = { version = "2", features = ["full", "visit", "extra-traits"] }

[lib]
name = "fe2o3_workgroup_sync_v1"
path = "src/lib.rs"
