[package]
name = "fe2o3-gfx950-advanced-attention"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/fe2o3-gpu/fe2o3"
rust-version = "1.94"
publish = false

[workspace]
members = []
resolver = "3"

[features]
kernel-kda-decode = []
kernel-kda-decode-wave-tiled-v1 = ["kernel-kda-decode"]
kernel-kda-prefill = []
kernel-kda-prefill-channel-mask-v1 = ["kernel-kda-prefill"]
kernel-content-sparse-attention = []
kernel-content-sparse-attention-reciprocal-reuse-v1 = ["kernel-content-sparse-attention"]
kernel-compressed-hybrid-attention = []
kernel-compressed-hybrid-attention-division-baseline-v1 = ["kernel-compressed-hybrid-attention"]
kernel-attnres-aggregate = []
kernel-attnres-aggregate-explicit-reuse-v1 = ["kernel-attnres-aggregate"]
kernel-four-branch-residual = []
kernel-four-branch-residual-explicit-v1 = ["kernel-four-branch-residual"]
kernel-mhc-sinkhorn-mix = ["kernel-mhc-sinkhorn-mix-distributed-wave16-v1"]
kernel-mhc-sinkhorn-mix-distributed-wave16-v1 = []
kernel-mhc-sinkhorn-mix-scalar-v1 = ["kernel-mhc-sinkhorn-mix"]

[dependencies]
fe2o3-device = { path = "../../crates/fe2o3-device" }

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host = { path = "../../crates/fe2o3-host" }

[dev-dependencies]
syn = { version = "2", features = ["full"] }

[lib]
name = "fe2o3_gfx950_advanced_attention"
path = "src/lib.rs"
