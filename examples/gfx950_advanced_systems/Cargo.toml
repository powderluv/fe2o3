[package]
name = "fe2o3-gfx950-advanced-systems"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/powderluv/fe2o3"
rust-version = "1.94"
publish = false

[features]
kernel-moe-route = []
kernel-moe-expert-rank = []
kernel-combine-expert-ranks = []
kernel-speculative-transaction = []
kernel-qwen-ngram-gather = []
kernel-stage-gradient-shard = []
kernel-muon-update = []
ablation-route-owner-only = []
ablation-route-unpacked = []
ablation-expert-serial = []
ablation-combine-transposed = []
ablation-speculative-recompute-prefix = []
ablation-ngram-reverse-probe = []
ablation-stage-tile4 = []
ablation-muon-broadcast16 = []

[workspace]

[dependencies]
fe2o3-device = { path = "../../crates/fe2o3-device" }

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host = { path = "../../crates/fe2o3-host" }

[lib]
name = "fe2o3_gfx950_advanced_systems"
path = "src/lib.rs"
