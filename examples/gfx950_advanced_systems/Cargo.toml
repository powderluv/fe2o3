[package]
name = "fe2o3-gfx950-advanced-systems"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/harsh-nod/fe2o3"
rust-version = "1.94"
publish = false

[features]
kernel-moe-route = []
kernel-moe-route-tile = ["kernel-moe-route"]
kernel-moe-expert-rank = []
kernel-moe-expert-rank-simt = ["kernel-moe-expert-rank"]
kernel-combine-expert-ranks = []
kernel-combine-expert-ranks-tile = ["kernel-combine-expert-ranks"]
kernel-speculative-transaction = []
kernel-speculative-transaction-tile = ["kernel-speculative-transaction"]
kernel-qwen-ngram-gather = []
kernel-qwen-ngram-gather-tile = ["kernel-qwen-ngram-gather"]
kernel-stage-gradient-shard = []
kernel-stage-gradient-shard-tile = ["kernel-stage-gradient-shard"]
kernel-muon-update = []
kernel-muon-update-tile = ["kernel-muon-update"]
ablation-route-owner-only = []
ablation-route-unpacked = []
ablation-route-redundant-lanes = []
ablation-expert-serial = []
ablation-combine-transposed = []
ablation-speculative-recompute-prefix = []
ablation-ngram-reverse-probe = []
ablation-stage-tile4 = []
ablation-muon-broadcast16 = []

[workspace]

[profile.test]
debug = 0

[dependencies]
fe2o3-device = { path = "../../crates/fe2o3-device" }

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host = { path = "../../crates/fe2o3-host" }

[dev-dependencies]
serde_json = "1"

[lib]
name = "fe2o3_gfx950_advanced_systems"
path = "src/lib.rs"
