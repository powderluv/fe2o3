[package]
name = "fe2o3-wave64-collectives-v1"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/harsh-nod/fe2o3"
rust-version = "1.94"
publish = false

# The package remains standalone so its proof and source tests do not widen the
# root workspace graph.
[workspace]

[features]
default = []
tile-kernel = []

[dependencies]
fe2o3-device = { path = "../../crates/fe2o3-device" }

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host = { path = "../../crates/fe2o3-host" }
quote = "1"
sha2 = { version = "0.11", default-features = false }
syn = { version = "2", features = ["full"] }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }

[lib]
name = "fe2o3_wave64_collectives_v1"
path = "src/lib.rs"

# Keep genuine binding-only host tests inside the existing executable image limit.
[profile.test]
debug = 0
