[package]
name = "fe2o3-vecadd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
fe2o3-device.workspace = true

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host.workspace = true
fe2o3-core = { path = "../../crates/fe2o3-core", optional = true }

[lib]
name = "fe2o3_vecadd"

[features]
default = []
structured-tile = []
gfx950-target = []
qualification-legacy-hip = ["dep:fe2o3-core", "fe2o3-core/qualification-unsafe-launch"]
