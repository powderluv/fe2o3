name: CI

on:
  merge_group:
    types: [checks_requested]
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity-policy:
    name: Generic parity policy gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Enforce parity promotion route
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EVENT_HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          case "${EVENT_NAME}" in
            pull_request)
              BASE_SHA="${PR_BASE_SHA}"
              HEAD_SHA="${EVENT_HEAD_SHA}"
              ;;
            merge_group)
              BASE_SHA="${MERGE_BASE_SHA}"
              HEAD_SHA="${MERGE_HEAD_SHA}"
              ;;
            push)
              HEAD_SHA="${EVENT_HEAD_SHA}"
              if [[ "${REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
                BASE_SHA="${PUSH_BEFORE_SHA}"
              else
                git check-ref-format "refs/heads/${DEFAULT_BRANCH}" >/dev/null || {
                  printf 'invalid default branch ref\n' >&2
                  exit 2
                }
                default_remote_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
                git fetch --no-tags --prune --force origin \
                  "+refs/heads/${DEFAULT_BRANCH}:${default_remote_ref}"
                BASE_SHA="$(
                  git rev-parse --verify "${default_remote_ref}^{commit}"
                )"
              fi
              ;;
            *)
              printf 'unsupported parity trust event: %s\n' "${EVENT_NAME}" >&2
              exit 2
              ;;
          esac
          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ || "${BASE_SHA}" =~ ^0{40}$ ]]; then
            printf 'missing or zero parity base SHA\n' >&2
            exit 2
          fi
          if [[ ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ || "${HEAD_SHA}" =~ ^0{40}$ ]]; then
            printf 'missing or zero parity head SHA\n' >&2
            exit 2
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          if [[ "${EVENT_NAME}" == push && "${REF_NAME}" != "${DEFAULT_BRANCH}" ]] &&
            ! git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"; then
            printf 'non-default branch head does not contain current protected default tip\n' >&2
            exit 2
          fi
          if git diff --quiet "${BASE_SHA}" "${HEAD_SHA}" -- \
            docs/cuda-oxide-parity-status.tsv; then
            exit 0
          fi
          if [[ "${EVENT_NAME}" == push && "${REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
            printf 'direct default-branch parity promotion is forbidden; repository rules must prevent this push\n' >&2
            exit 2
          fi
          printf 'parity promotion is authorized only by the protected merge-group reusable workflow\n'

          # Candidate-controlled pull-request and generic CI jobs never receive
          # id-token permission or invoke the production publisher service.

  generic-core:
    name: Generic core
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci/generic-core
      CI_LOG_DIR: ${{ github.workspace }}/target/ci-logs/generic-core

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install generic test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes llvm ripgrep

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Record tool versions
        run: |
          rustc -Vv
          cargo -V

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Run generic core validation
        run: scripts/ci-local.sh generic-core

      - name: Upload failure logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: generic-core-logs-${{ github.run_attempt }}
          path: ${{ env.CI_LOG_DIR }}/
          if-no-files-found: ignore
          retention-days: 7

  rustc-codegen-shards:
    name: Rustc codegen shard (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 01-production-pipeline
          - 02-production-drivers
          - 03-device-ffi
          - 04-frontend-types
          - 05-abi-semantics
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci/rustc-codegen-${{ matrix.shard }}
      CI_LOG_DIR: ${{ github.workspace }}/target/ci-logs/rustc-codegen-${{ matrix.shard }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install generic test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Record tool versions
        run: |
          rustc -Vv
          cargo -V

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Run target-isolated codegen integration shard
        run: scripts/ci-local.sh rustc-codegen-shard "${{ matrix.shard }}"

      - name: Upload failure logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustc-codegen-${{ matrix.shard }}-logs-${{ github.run_attempt }}
          path: ${{ env.CI_LOG_DIR }}/
          if-no-files-found: ignore
          retention-days: 7

  generic-validation:
    name: Generic validation
    if: ${{ always() }}
    needs:
      - generic-core
      - rustc-codegen-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Require every generic dependency to succeed
        env:
          GENERIC_CORE_RESULT: ${{ needs.generic-core.result }}
          RUSTC_CODEGEN_SHARDS_RESULT: ${{ needs.rustc-codegen-shards.result }}
        run: >-
          scripts/require-ci-success.sh
          "${GENERIC_CORE_RESULT}"
          "${RUSTC_CODEGEN_SHARDS_RESULT}"
