name: Authenticated Verus reviewed host

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authenticated-verus-reviewed-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reviewed-host:
    if: ${{ github.repository == 'harsh-nod/fe2o3' }}
    name: Pinned closure debug and release
    runs-on: [self-hosted, linux, x64, fe2o3-verus-reviewed-host-v1]
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run pinned-host authenticated Verus tests
        run: scripts/ci-authenticated-verus-reviewed-host.sh
