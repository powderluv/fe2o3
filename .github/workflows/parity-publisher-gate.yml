name: Protected parity publisher gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    name: Protected publisher authorization
    runs-on: ubuntu-24.04
    environment: protected-publisher
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Require current default-tip merge group
        id: merge-identity
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_EVENT_NAME}" == merge_group ]]
          [[ "${BASE_REF}" == "refs/heads/${DEFAULT_BRANCH}" ]]
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ && ! "${BASE_SHA}" =~ ^0{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ && ! "${HEAD_SHA}" =~ ^0{40}$ ]]
          git check-ref-format "refs/heads/${DEFAULT_BRANCH}" >/dev/null

          default_tip_root="${RUNNER_TEMP}/parity-merge-default-tip.git"
          default_remote_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
          git init --bare "${default_tip_root}"
          git -C "${default_tip_root}" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="$(
            printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n'
          )"
          git -C "${default_tip_root}" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags --depth=1 --force origin \
            "+refs/heads/${DEFAULT_BRANCH}:${default_remote_ref}"
          unset auth_header
          current_default_sha="$(
            git -C "${default_tip_root}" rev-parse --verify \
              "${default_remote_ref}^{commit}"
          )"
          if [[ "${current_default_sha}" != "${BASE_SHA}" ]]; then
            printf 'merge-group base SHA is not current default tip\n' >&2
            exit 2
          fi
          printf 'base=%s\n' "${BASE_SHA}" >>"${GITHUB_OUTPUT}"
          printf 'head=%s\n' "${HEAD_SHA}" >>"${GITHUB_OUTPUT}"
          printf 'default=%s\n' "${current_default_sha}" >>"${GITHUB_OUTPUT}"

      - name: Check out protected merge base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.merge-identity.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
          path: protected

      - name: Check out merge-group candidate as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.merge-identity.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Revalidate protected state on synthetic merge
        env:
          BASE_SHA: ${{ steps.merge-identity.outputs.base }}
          HEAD_SHA: ${{ steps.merge-identity.outputs.head }}
          CURRENT_DEFAULT_SHA: ${{ steps.merge-identity.outputs.default }}
          FE2O3_PUBLISHER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FE2O3_PUBLISHER_SERVICE_URL: ${{ vars.FE2O3_PUBLISHER_SERVICE_URL }}
          FE2O3_PUBLISHER_SERVICE_HOST: ${{ vars.FE2O3_PUBLISHER_SERVICE_HOST }}
          FE2O3_PUBLISHER_GITHUB_ENVIRONMENT: protected-publisher
          FE2O3_PUBLISHER_OIDC_AUDIENCE: ${{ vars.FE2O3_PUBLISHER_OIDC_AUDIENCE }}
          FE2O3_PUBLISHER_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          set -Eeuo pipefail
          python3 protected/scripts/parity-signed-evidence.py check-protected-base \
            --protected-repo protected \
            --candidate-repo candidate \
            --protected-base "${BASE_SHA}" \
            --default-tip "${CURRENT_DEFAULT_SHA}" \
            --candidate-head "${HEAD_SHA}"

          status_path=docs/cuda-oxide-parity-status.tsv
          trust_paths=(
            docs/parity-row-evidence-policy-v2.tsv
            docs/parity-evidence/trust-policy-v2.tsv
            docs/parity-evidence/trusted-keys
            scripts/parity-publisher-client.py
            scripts/parity-signed-evidence.py
            scripts/parity-protected-change-policy.sh
            scripts/parity-repository-rules.py
            scripts/parity-repository-rules.sh
            .github/workflows/ci.yml
            .github/workflows/parity-promotion.yml
            .github/workflows/parity-publisher-gate.yml
            .github/CODEOWNERS
            .github/parity-trust-reviewers.txt
          )
          status_changed=false
          trust_changed=false
          if ! git -C candidate diff --quiet "${BASE_SHA}" "${HEAD_SHA}" -- \
            "${status_path}"; then
            status_changed=true
          fi
          if ! git -C candidate diff --quiet "${BASE_SHA}" "${HEAD_SHA}" -- \
            "${trust_paths[@]}"; then
            trust_changed=true
          fi
          if [[ "${status_changed}" == true && "${trust_changed}" == true ]]; then
            printf 'merge group mixes trust and parity status changes\n' >&2
            exit 2
          fi
          if [[ "${trust_changed}" == true ]]; then
            python3 protected/scripts/parity-signed-evidence.py check-trust-update \
              --protected-root protected \
              --protected-policy protected/docs/parity-evidence/trust-policy-v2.tsv \
              --candidate-root candidate \
              --candidate-policy candidate/docs/parity-evidence/trust-policy-v2.tsv \
              --protected-row-policy protected/docs/parity-row-evidence-policy-v2.tsv \
              --candidate-row-policy candidate/docs/parity-row-evidence-policy-v2.tsv
            printf 'merge-group trust monotonicity passed; protected PR review is externally required\n'
            exit 0
          fi
          if [[ "${status_changed}" == false ]]; then
            printf 'merge group has no protected parity change\n'
            exit 0
          fi

          test -f protected/docs/parity-evidence/trust-policy-v2.tsv
          test -d protected/docs/parity-evidence/trusted-keys
          test -f candidate/docs/parity-evidence/archive/manifests/promotion-v2.tsv
          publisher_receipt_root="${RUNNER_TEMP}/fe2o3-protected-publisher-receipt"
          publisher_challenge_file="${RUNNER_TEMP}/fe2o3-protected-publisher-challenge"
          python3 protected/scripts/parity-publisher-client.py \
            --repo candidate \
            --archive-root candidate/docs/parity-evidence/archive \
            --manifest manifests/promotion-v2.tsv \
            --baseline-status protected/docs/cuda-oxide-parity-status.tsv \
            --candidate-status candidate/docs/cuda-oxide-parity-status.tsv \
            --default-tip "${BASE_SHA}" \
            --candidate-head "${HEAD_SHA}" \
            --logical-destination docs/parity-evidence/archive \
            --trusted-root protected \
            --trust-policy protected/docs/parity-evidence/trust-policy-v2.tsv \
            --receipt-root "${publisher_receipt_root}" \
            --challenge-file "${publisher_challenge_file}"
          IFS= read -r publisher_challenge <"${publisher_challenge_file}"
          python3 protected/scripts/parity-signed-evidence.py gate \
            --repo candidate \
            --archive-root candidate/docs/parity-evidence/archive \
            --trusted-root protected \
            --trust-policy protected/docs/parity-evidence/trust-policy-v2.tsv \
            --manifest manifests/promotion-v2.tsv \
            --trusted-policy protected/docs/parity-row-evidence-policy-v2.tsv \
            --candidate-policy candidate/docs/parity-row-evidence-policy-v2.tsv \
            --baseline-status protected/docs/cuda-oxide-parity-status.tsv \
            --candidate-status candidate/docs/cuda-oxide-parity-status.tsv \
            --publisher-receipt-root "${publisher_receipt_root}" \
            --expected-logical-destination docs/parity-evidence/archive \
            --expected-publisher-challenge "${publisher_challenge}" \
            --expected-default-tip "${BASE_SHA}" \
            --expected-candidate-head "${HEAD_SHA}"

          # Repository rules must require this reusable workflow from the
          # protected default branch and a one-entry merge queue with no bypass.
