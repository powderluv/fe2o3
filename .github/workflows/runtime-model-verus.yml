name: Runtime model authenticated Verus

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-model-verus.yml"
      - "crates/fe2o3-runtime-model/**"
      - "crates/fe2o3-runtime/**"
      - "crates/fe2o3-resource-accounting/**"
      - "crates/fe2o3-kfd/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "examples/row_softmax_v1/verify-verus-closure.sh"
      - "examples/wave64_collectives_v1/check-proof-source.py"
      - "scripts/qualify-runtime-production-proofs.sh"
      - "scripts/tests/runtime-production-proof-pipeline.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-model-verus.yml"
      - "crates/fe2o3-runtime-model/**"
      - "crates/fe2o3-runtime/**"
      - "crates/fe2o3-resource-accounting/**"
      - "crates/fe2o3-kfd/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "examples/row_softmax_v1/verify-verus-closure.sh"
      - "examples/wave64_collectives_v1/check-proof-source.py"
      - "scripts/qualify-runtime-production-proofs.sh"
      - "scripts/tests/runtime-production-proof-pipeline.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-model-verus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-runtime-model:
    name: Device identity and lifecycle proofs
    runs-on: ubuntu-24.04
    # The expanded inventory exceeded 39 minutes before reaching its later
    # campaigns. This is job-level headroom only; per-proof limits stay fixed.
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Verus Rust toolchain
        run: >-
          rustup toolchain install 1.97.1-x86_64-unknown-linux-gnu
          --profile minimal --no-self-update

      - name: Install pinned Verus closure
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly version="0.2026.08.09.92f466f"
          readonly archive="${RUNNER_TEMP}/verus-${version}-x86-linux.zip"
          readonly install_dir="${RUNNER_TEMP}/pinned-verus"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/verus-lang/verus/releases/download/release/${version}/verus-${version}-x86-linux.zip"
          mkdir -- "${install_dir}"
          unzip -q "${archive}" -d "${install_dir}"
          printf 'VERUS=%s\n' "${install_dir}/verus-x86-linux/verus" >> "${GITHUB_ENV}"

      - name: Verify authenticated runtime model
        run: crates/fe2o3-runtime-model/verus/verify-verus.sh

  producer-live-composition:
    name: Production producer, planner and retained-dispatch proofs
    # The unchanged proof admission requires 16 GiB available, not total RAM.
    # Never run unreviewed pull-request code on a protected/shared host.
    if: ${{ github.repository == 'harsh-nod/fe2o3' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    # The commit label is routing, not an authorization boundary. Signed-source
    # admission and independent runner/result validation remain required.
    runs-on:
      - self-hosted
      - linux
      - x64
      - fe2o3-verus-reviewed-host-v1
      - "fe2o3-verus-commit-${{ github.sha }}"
    timeout-minutes: 300
    steps:
      - name: Create private campaign directory
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$(mktemp -d "${RUNNER_TEMP}/fe2o3-producer-live.XXXXXXXX")"
          printf 'A2_CAMPAIGN_ROOT=%s\n' "${root}" >> "${GITHUB_ENV}"

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Verus Rust toolchain
        run: >-
          rustup toolchain install 1.97.1-x86_64-unknown-linux-gnu
          --profile minimal --no-self-update

      - name: Install pinned Verus closure
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly version="0.2026.08.09.92f466f"
          readonly archive="${A2_CAMPAIGN_ROOT}/verus-${version}-x86-linux.zip"
          readonly install_dir="${A2_CAMPAIGN_ROOT}/pinned-verus"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/verus-lang/verus/releases/download/release/${version}/verus-${version}-x86-linux.zip"
          mkdir -- "${install_dir}"
          unzip -q "${archive}" -d "${install_dir}"
          printf 'VERUS=%s\n' "${install_dir}/verus-x86-linux/verus" >> "${GITHUB_ENV}"

      - name: Qualify producer-to-planner input composition
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -I -B crates/fe2o3-runtime-model/verus/test-producer-planner-input-composition.py
          python3 -I -B crates/fe2o3-runtime-model/verus/qualify-producer-planner-input-v1.py \
            --inputs "${GITHUB_WORKSPACE}/crates/fe2o3-runtime-model/verus/pins/PRODUCER_PLANNER_INPUT_CAMPAIGN_V1.json" \
            --verus "${VERUS}" \
            --output "${A2_CAMPAIGN_ROOT}/planner-input"

      - name: Qualify whole roots and exact negative controls
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -I -B crates/fe2o3-runtime-model/verus/qualify-producer-live-composition-v1.py \
            --verus "${VERUS}" \
            --output "${A2_CAMPAIGN_ROOT}/campaign"

      - name: Test required production campaign sequencing
        run: python3 -I -B scripts/tests/runtime-production-proof-pipeline.py

      - name: Qualify signed-source dispatch and retained proofs
        shell: bash
        # Controllers authenticate signed HEAD and exact Git/SSH tool pins.
        run: bash scripts/qualify-runtime-production-proofs.sh

      - name: Retain complete campaign diagnostics
        if: ${{ always() && env.A2_CAMPAIGN_ROOT != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: producer-live-composition-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.A2_CAMPAIGN_ROOT }}/campaign
            ${{ env.A2_CAMPAIGN_ROOT }}/planner-input
            ${{ env.A2_CAMPAIGN_ROOT }}/template-prepare
            ${{ env.A2_CAMPAIGN_ROOT }}/template-preflight
            ${{ env.A2_CAMPAIGN_ROOT }}/template-bind
            ${{ env.A2_CAMPAIGN_ROOT }}/template-roster
            ${{ env.A2_CAMPAIGN_ROOT }}/producer-preflight
            ${{ env.A2_CAMPAIGN_ROOT }}/retained-routing
            ${{ env.A2_CAMPAIGN_ROOT }}/retained-credit
            ${{ env.A2_CAMPAIGN_ROOT }}/graph-version-ledger
            ${{ env.A2_CAMPAIGN_ROOT }}/graph-reservation-retirement
            ${{ env.A2_CAMPAIGN_ROOT }}/context-cached-poll
            ${{ env.A2_CAMPAIGN_ROOT }}/context-writer-lookup
          if-no-files-found: warn
          retention-days: 7

      - name: Remove private campaign directory
        if: ${{ always() && env.A2_CAMPAIGN_ROOT != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(dirname -- "${A2_CAMPAIGN_ROOT}")" == "${RUNNER_TEMP}" ]]
          [[ "$(basename -- "${A2_CAMPAIGN_ROOT}")" == fe2o3-producer-live.* ]]
          [[ -d "${A2_CAMPAIGN_ROOT}" && ! -L "${A2_CAMPAIGN_ROOT}" ]]
          rm -r -- "${A2_CAMPAIGN_ROOT}"
