name: AMD GPU hardware smoke

on:
  workflow_dispatch:
    inputs:
      confirm_hardware:
        description: Confirm this run may create KFD resources and execute repository fixtures
        required: true
        default: false
        type: boolean
      target:
        description: KFD admission target (currently gfx942)
        required: true
        default: gfx942
        type: string

permissions:
  contents: read

concurrency:
  group: hardware-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: ${{ inputs.confirm_hardware }}
    name: Validate KFD resources and one profiled repository dispatch
    runs-on: [self-hosted, linux, x64, rocm, amd-gpu]
    environment: gpu-hardware
    timeout-minutes: 120
    env:
      FE2O3_ALLOW_GPU_SMOKE: '1'
      FE2O3_TARGET: ${{ inputs.target }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Run guarded KFD hardware suite
        run: scripts/ci-local.sh hardware-smoke

      - name: Upload direct-KFD profiler smoke evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-kfd-profiler-smoke
          path: target/fe2o3/kfd-profiler-hardware-smoke/
          if-no-files-found: error
          retention-days: 7

      - name: Upload smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hardware-smoke-artifacts
          path: |
            target/ci-logs/
            target/fe2o3/
          if-no-files-found: ignore
          retention-days: 7
