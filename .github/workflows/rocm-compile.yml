name: ROCm compile coverage

on:
  workflow_dispatch:
    inputs:
      target:
        description: Exact production qualification target
        required: true
        default: gfx942
        type: choice
        options:
          - gfx942

permissions:
  contents: read

concurrency:
  group: rocm-compile-${{ inputs.target }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Validate production compilation for ${{ inputs.target }}
    runs-on: [self-hosted, linux, x64, rocm]
    timeout-minutes: 90
    env:
      FE2O3_TARGET: ${{ inputs.target }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Run production extraction and code-object checks
        run: scripts/ci-local.sh rocm-compile

      - name: Upload compiler failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rocm-compile-${{ inputs.target }}-artifacts
          path: |
            target/ci-logs/
            target/fe2o3/
          if-no-files-found: ignore
          retention-days: 7
