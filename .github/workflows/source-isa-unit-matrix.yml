name: Protected source ISA ordinary-unit matrix

# Manual-only until a protected authority service registers the qualified runner label below.
# Generic CI still compiles the ignored Rust test and freezes this workflow through policy tests.

on:
  workflow_dispatch:
    inputs:
      confirm_protected_runner:
        description: Confirm the qualified runner authority service is available
        required: true
        default: false
        type: boolean
      confirm_characteristic_contract_v2:
        description: Validate the lossless V2 characteristic contract and adapter tests
        required: true
        default: false
        type: boolean
      confirm_characteristic_matrix_v2:
        description: Run the protected ordinary-source V2 characteristic matrix
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: source-isa-unit-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  protected-observer:
    if: >-
      github.repository == 'harsh-nod/fe2o3' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_protected_runner
    name: Observe three ordinary units on gfx942 and gfx950
    runs-on: [self-hosted, linux, x64, fe2o3-source-isa-protected-v1]
    timeout-minutes: 120
    env:
      FE2O3_RUN_SOURCE_ISA_UNIT_MATRIX: '1'

    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run protected ordinary-unit matrix
        run: scripts/ci-local.sh source-isa-unit-matrix

  characteristic-contract-v2:
    if: >-
      github.repository == 'harsh-nod/fe2o3' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_characteristic_contract_v2
    # This validates the authority-free reference, adapter, query, and hostile framing logic. It
    # does not run the protected 3x2 matrix or substitute for protected authority evidence.
    name: Validate lossless characteristic V2 contract and adapter
    runs-on: [self-hosted, linux, x64, fe2o3-source-isa-protected-v1]
    timeout-minutes: 30
    env:
      FE2O3_RUN_SOURCE_ISA_CHARACTERISTIC_CONTRACT_V2: '1'

    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate V2 acceptance and transport contract only
        run: scripts/ci-local.sh source-isa-characteristic-contract-v2

  protected-characteristic-v2:
    if: >-
      github.repository == 'harsh-nod/fe2o3' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_protected_runner &&
      inputs.confirm_characteristic_matrix_v2
    name: Observe exact characteristics for three ordinary units on gfx942 and gfx950
    runs-on: [self-hosted, linux, x64, fe2o3-source-isa-protected-v1]
    timeout-minutes: 120
    env:
      FE2O3_RUN_SOURCE_ISA_CHARACTERISTIC_MATRIX_V2: '1'

    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run protected ordinary-source characteristic matrix
        run: scripts/ci-local.sh source-isa-characteristic-matrix-v2
