[package]
name = "fe2o3-broker-authority-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Inert protected-service admission boundary for future fe2o3 broker authority."
publish = false

[features]
test-support = []

[dependencies]
fe2o3-artifact-transaction.workspace = true
fe2o3-build-authority.workspace = true
fe2o3-compiler-closure-capability.workspace = true
fe2o3-compiler-execution-protocol.workspace = true
fe2o3-compiler-lineage.workspace = true
fe2o3-external-anchor-protocol.workspace = true
fe2o3-host-link-closure = { path = "../fe2o3-host-link-closure" }
fe2o3-kernel-ir.workspace = true
fe2o3-process-identity.workspace = true
fe2o3-protected-service-profile.workspace = true
fe2o3-protected-service-spawn.workspace = true
fe2o3-protected-static-executable.workspace = true
fe2o3-rustc-invocation.workspace = true
fe2o3-runtime-protocol.workspace = true
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast", "zeroize"] }
libc.workspace = true
rustix = { workspace = true, features = ["event", "process", "rand", "thread"] }
sha2.workspace = true
zeroize = "=1.9.0"

[dev-dependencies]
fe2o3-compiler-ffi.workspace = true
serde = "=1.0.229"
tempfile = "=3.21.0"
