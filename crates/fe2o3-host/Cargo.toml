[package]
name = "fe2o3-host"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Host-side launch helpers for fe2o3."

[features]
hardware-test-hooks = [
    "dep:rmpv",
    "fe2o3-artifact-transaction/test-hooks",
    "qualification-legacy-hip-hsa",
]
worker-v3-verifier-test-support = []
# Retains the deprecated HIP-buffer/HSA-lifecycle qualification surface. New
# applications and generated bindings use the direct-KFD path.
qualification-legacy-hip-hsa = [
    "dep:fe2o3-core",
    "fe2o3-core/qualification-legacy-hip-runtime",
]

[dependencies]
fe2o3-aql.workspace = true
fe2o3-amd-target.workspace = true
fe2o3-artifact-transaction.workspace = true
fe2o3-artifacts.workspace = true
fe2o3-core = { workspace = true, optional = true }
fe2o3-compiler-ffi.workspace = true
fe2o3-compiler-execution-protocol.workspace = true
fe2o3-compiler-lineage.workspace = true
fe2o3-device.workspace = true
fe2o3-hsaco.workspace = true
fe2o3-hsaco-finalize.workspace = true
fe2o3-kernel-analysis = { workspace = true, features = ["authenticated-machine-effect"] }
fe2o3-kernel-descriptor.workspace = true
fe2o3-kernel-ir.workspace = true
fe2o3-kfd.workspace = true
fe2o3-mir-model.workspace = true
fe2o3-resource-accounting.workspace = true
fe2o3-runtime.workspace = true
fe2o3-runtime-model.workspace = true
fe2o3-runtime-protocol.workspace = true
fe2o3-rustc-invocation.workspace = true
fe2o3-verifier.workspace = true
libc.workspace = true
reserved-fe2o3-symbols.workspace = true
rmpv = { version = "1.3.1", default-features = false, optional = true }
rustix = { workspace = true, features = ["process"] }
sha2.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fe2o3-compiler-execution-client.workspace = true

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
fe2o3-amdhsa-loader.workspace = true
fe2o3-compiler-closure-capability.workspace = true
fe2o3-service-host.workspace = true

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast", "zeroize"] }
fe2o3-amdgcn-model.workspace = true
fe2o3-functional-proof = { workspace = true, features = ["internal-proof-staging"] }
fe2o3-proof-contracts.workspace = true
fe2o3-artifact-transaction = { workspace = true, features = ["test-hooks"] }
fe2o3-build-authority.workspace = true
fe2o3-external-anchor-protocol.workspace = true
rmpv = { version = "1.3.1", default-features = false }
serde = "1"
serde_json = "1"
tempfile = "=3.21.0"
trybuild = "1"

[lib]
name = "fe2o3_host"

[[test]]
name = "argument_alias_ui"
path = "tests/argument_alias_ui.rs"
required-features = ["qualification-legacy-hip-hsa"]

[[test]]
name = "artifact_binding_ui"
path = "tests/artifact_binding_ui.rs"
required-features = ["qualification-legacy-hip-hsa"]

[[test]]
name = "gfx942_tile_interop_hardware"
path = "tests/gfx942_tile_interop_hardware.rs"
required-features = ["qualification-legacy-hip-hsa"]

[[test]]
name = "hsa_executable_lifecycle_ui"
path = "tests/hsa_executable_lifecycle_ui.rs"
required-features = ["qualification-legacy-hip-hsa"]

[[test]]
name = "prepared_launch_ui"
path = "tests/prepared_launch_ui.rs"
required-features = ["qualification-legacy-hip-hsa"]

[[test]]
name = "published_direct_link_ui"
path = "tests/published_direct_link_ui.rs"
required-features = ["qualification-legacy-hip-hsa"]

[[test]]
name = "tile_interop_ui"
path = "tests/tile_interop_ui.rs"
required-features = ["qualification-legacy-hip-hsa"]
