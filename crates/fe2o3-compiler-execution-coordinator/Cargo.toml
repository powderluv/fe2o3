[package]
name = "fe2o3-compiler-execution-coordinator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Root-owned deployment coordinator for the fe2o3 compiler-execution supervisor."
publish = false

[dependencies]
fe2o3-artifact-transaction.workspace = true
fe2o3-broker-authority-service.workspace = true
fe2o3-build-authority.workspace = true
fe2o3-compiler-closure-capability.workspace = true
fe2o3-compiler-execution-lifecycle.workspace = true
fe2o3-compiler-execution-protocol.workspace = true
fe2o3-compiler-execution-supervisor.workspace = true
fe2o3-compiler-lineage.workspace = true
fe2o3-external-anchor-coordinator.workspace = true
fe2o3-kernel-ir.workspace = true
fe2o3-protected-service-profile.workspace = true
fe2o3-protected-service-spawn.workspace = true
fe2o3-protected-static-executable.workspace = true
fe2o3-runtime-protocol.workspace = true
fe2o3-rustc-invocation.workspace = true
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast", "zeroize"] }
libc.workspace = true
rustix = { workspace = true, features = ["event", "pipe", "process", "rand", "termios", "thread"] }
sha2.workspace = true
subtle = "=2.6.1"
zeroize = "=1.9.0"

[dev-dependencies]
fe2o3-compiler-ffi.workspace = true
fe2o3-protected-service-spawn = { workspace = true, features = ["test-support"] }
tempfile = "=3.21.0"

[lints.rust]
unsafe_code = "deny"

[[bin]]
name = "fe2o3-compiler-execution-coordinator"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "fe2o3-compiler-execution-provision"
path = "src/provision_main.rs"
test = false
bench = false

[[bin]]
name = "fe2o3-compiler-execution-coordinator-v1"
path = "src/main_v1.rs"
test = false
bench = false

[[bin]]
name = "fe2o3-compiler-execution-provision-v1"
path = "src/provision_main_v1.rs"
test = false
bench = false
